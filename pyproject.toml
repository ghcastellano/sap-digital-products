[project]
name = "sap-consulting-kb"
version = "0.1.0"
description = "SAP Digital Products - Consulting Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4",
    "sentence-transformers>=2.5",
    "rank-bm25>=0.2.2",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10",
    "python-docx>=1.1",
    "openai>=1.12",
    "anthropic>=0.40.0",
    "Pillow>=10.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer[all]>=0.9",
]

[project.scripts]
sap-cli = "sapkb.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
