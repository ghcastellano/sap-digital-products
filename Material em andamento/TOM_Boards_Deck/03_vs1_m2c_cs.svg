      <text x="14" y="164" font-size="11" fill="#9FB3D1">Vitor + Carlos + Kumar + PM stewards · investment approval · capacity slotting</text>

      <text x="14" y="194" font-size="13" font-weight="700" fill="#FFFFFF">Big Room Planning (BRP) <tspan fill="#9FB3D1" font-weight="400">— quarterly</tspan></text>
      <text x="14" y="212" font-size="11" font-style="italic" fill="#F08A3E">Reference: P&amp;S nWOW v1.2 BRP cadence (most mature playbook in the org — Q2 2026 deck)</text>
