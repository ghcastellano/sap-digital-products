    <!-- Planning approach -->
    <g transform="translate(20,244)">
      <rect width="1080" height="200" rx="6" fill="#1F4E79"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#F4C988" letter-spacing="1">PLANNING APPROACH (continuous, not in batches)</text>
      <text x="14" y="50" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Continuous prioritization</tspan> at sprint and BRP cadence (not waterfall annual)</text>
      <text x="14" y="72" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Pain Score auto-ranks</tspan> the backlog with CS weighting (UX-heavy):</text>
      <text x="14" y="94" font-size="13" fill="#F4C988" font-weight="700">  H(x) = (BV·0.35 + UX·0.40 + Safety·0.25) / Effort</text>
      <text x="14" y="118" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Class of Service mix</tspan> per quarter target: 70% Standard · 15% Fixed-Date · 5–10% Expedite · 10–15% Intangible</text>
      <text x="14" y="140" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Run/Grow/Transform</tspan> tagged at intake; default mix ~50% Run · 35% Grow · 15% Transform</text>
      <text x="14" y="162" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Capacity reserve</tspan> 10–15% per quarter for Intangible (tech debt) + 5% for Expedite (P1/P2)</text>
      <text x="14" y="184" font-size="11" font-style="italic" fill="#9FB3D1">Sources: CS Proposed Value Streams Slide 3 · Prioritization Criteria doc (2026-04)</text>
    </g>

