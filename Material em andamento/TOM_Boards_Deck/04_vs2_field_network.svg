<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1F3458"/>
    </pattern>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="#0E2240"/>
  <rect width="2400" height="1350" fill="url(#dotgrid)" opacity="0.5"/>

  <rect x="0" y="0" width="2400" height="14" fill="#5DA460"/>
  <text x="60" y="68" font-size="14" font-weight="700" fill="#F08A3E" letter-spacing="3">04  ·  VALUE STREAM DETAIL</text>
  <text x="60" y="118" font-size="40" font-weight="800" fill="#FFFFFF">VS-2 · Field &amp; Network Operations</text>
  <text x="60" y="148" font-size="16" fill="#C2E5C2">ITBA branch · Carlos Garbin · ~13 FTE · Two squads supporting field crews and grid operations</text>

  <!-- 2 squads -->
  <g transform="translate(60,190)" filter="url(#cardShadow)">
    <rect width="1140" height="370" rx="10" fill="#C2E5C2"/>
    <rect width="1140" height="46" rx="10" fill="#1F5722"/>
    <text x="20" y="30" font-size="18" font-weight="800" fill="#C2E5C2">SQUAD G&amp;E · Electric &amp; Gas Operations</text>

    <text x="20" y="78" font-size="13" font-weight="700" fill="#1F5722">Lead · Champion</text>
    <text x="20" y="98" font-size="13" fill="#1A1A1A">Bruno Moreto (Sr Mgr E&amp;G Ops Products)</text>
    <text x="20" y="116" font-size="13" fill="#1A1A1A">Andrew McGibbon (G&amp;E Champion)</text>

    <text x="20" y="148" font-size="13" font-weight="700" fill="#1F5722">Capacity</text>
    <text x="20" y="168" font-size="13" fill="#1A1A1A">7 FTE — Dan Gauthier (Mgr) · Brijesh Pandey · Jeferson Lima · Maynor Rojas · Vinay Math · vacant (ex-Kevin retired Dec)</text>

    <text x="20" y="200" font-size="13" font-weight="700" fill="#1F5722">Applications (~70–90)</text>
    <text x="20" y="220" font-size="12" fill="#1A1A1A">Android/tablets for field crews · doc viewer · field apps</text>
    <text x="20" y="238" font-size="12" fill="#1A1A1A">G&amp;E operations · Outage tooling · Inspections platform</text>

    <text x="20" y="270" font-size="13" font-weight="700" fill="#1F5722">Demand sources</text>
    <text x="20" y="290" font-size="12" fill="#1A1A1A">Electric &amp; Gas Field Operations · OSG</text>
    <text x="20" y="308" font-size="12" fill="#1A1A1A">P&amp;S Networks (BRP quarterly) · regulatory updates</text>

    <text x="20" y="340" font-size="11" font-style="italic" fill="#3D5A3F">Vendor: occasional vendor for upgrades · ProjectWise/Microstation gated by Third-Party Risk Assessment</text>
  </g>

  <g transform="translate(1220,190)" filter="url(#cardShadow)">
    <rect width="1120" height="370" rx="10" fill="#C2E5C2"/>
    <rect width="1120" height="46" rx="10" fill="#1F5722"/>
    <text x="20" y="30" font-size="18" font-weight="800" fill="#C2E5C2">SQUAD GIS &amp; OSG</text>

    <text x="20" y="78" font-size="13" font-weight="700" fill="#1F5722">Lead · Champion</text>
    <text x="20" y="98" font-size="13" fill="#1A1A1A">George Porto (Sr Mgr GIS &amp; OSG)</text>
    <text x="20" y="116" font-size="13" fill="#1A1A1A">George Porto (also acts as GIS Champion)</text>

    <text x="20" y="148" font-size="13" font-weight="700" fill="#1F5722">Capacity</text>
    <text x="20" y="168" font-size="13" fill="#1A1A1A">6 FTE — Anatoliy Semchishin · Annette Murano · Gang Li · Roy Yeboah · Steven Birney · Tariq Basheer</text>

    <text x="20" y="200" font-size="13" font-weight="700" fill="#1F5722">Applications</text>
    <text x="20" y="220" font-size="12" fill="#1A1A1A">SAP HANA · ARCFM · GIS web apps · data replication</text>
    <text x="20" y="238" font-size="12" fill="#1A1A1A">SWF platform · ProjectWise · Microstation</text>

    <text x="20" y="270" font-size="13" font-weight="700" fill="#1F5722">Demand sources</text>
    <text x="20" y="290" font-size="12" fill="#1A1A1A">Business Jira tickets (small) · Email · meetings</text>
    <text x="20" y="308" font-size="12" fill="#1A1A1A">IT Now (break-fix) · yearly PDD (medium-large)</text>

    <text x="20" y="340" font-size="11" font-style="italic" fill="#3D5A3F">Vendor: SWF for project work · vendor partnerships for major upgrades</text>
  </g>

  <!-- HOW THEY WORK -->
  <g transform="translate(60,590)" filter="url(#cardShadow)">
    <rect width="1140" height="700" rx="10" fill="#15304F" stroke="#5DA460" stroke-width="2"/>
    <rect width="1140" height="46" rx="10" fill="#5DA460"/>
    <text x="20" y="30" font-size="18" font-weight="800" fill="#FFFFFF">HOW THE SQUADS WORK · Rituals &amp; Cadences</text>

    <g transform="translate(20,68)">
      <rect width="540" height="100" rx="6" fill="#1F4E79"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#C2E5C2" letter-spacing="1">DAILY</text>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#FFFFFF">Daily Flow Review · 15 min · per squad</text>
      <text x="14" y="68" font-size="11" fill="#9FB3D1">Squad Lead + Tech Lead + duty engineer (rotation)</text>
      <text x="14" y="84" font-size="11" fill="#9FB3D1">Walk board · unblock · rebalance Expedite items</text>
    </g>

    <g transform="translate(580,68)">
      <rect width="540" height="100" rx="6" fill="#1F4E79"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#C2E5C2" letter-spacing="1">WEEKLY</text>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#FFFFFF">Replenishment Meeting · per squad</text>
      <text x="14" y="68" font-size="11" fill="#9FB3D1">P&amp;T PM steward + Squad Lead pull from Portfolio Board</text>
      <text x="14" y="84" font-size="11" fill="#9FB3D1">break-fix prioritized first (CoS Standard FIFO)</text>
    </g>

    <g transform="translate(20,184)">
      <rect width="540" height="100" rx="6" fill="#1F4E79"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#C2E5C2" letter-spacing="1">BI-WEEKLY</text>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#FFFFFF">Service Delivery Review · per squad</text>
      <text x="14" y="68" font-size="11" fill="#9FB3D1">Flow KPIs review (Lead/Cycle/Throughput/WIP Aging)</text>
      <text x="14" y="84" font-size="11" fill="#9FB3D1">Field operations stakeholder participates</text>
    </g>

    <g transform="translate(580,184)">
      <rect width="540" height="100" rx="6" fill="#1F4E79"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#C2E5C2" letter-spacing="1">BI-WEEKLY</text>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#FFFFFF">Retrospective / Kaizen · per squad</text>
      <text x="14" y="68" font-size="11" fill="#9FB3D1">Squad-only · focused on break-fix patterns &amp; root cause</text>
    </g>

    <g transform="translate(20,300)">
      <rect width="540" height="100" rx="6" fill="#1F5722"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#C2E5C2" letter-spacing="1">MONTHLY</text>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#FFFFFF">Portfolio Committee (Gate 2) · cross-VS</text>
      <text x="14" y="68" font-size="11" fill="#C2E5C2">Vitor + Carlos + PM stewards · investment slotting</text>
    </g>

    <g transform="translate(580,300)">
      <rect width="540" height="100" rx="6" fill="#1F5722"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#C2E5C2" letter-spacing="1">MONTHLY</text>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#FFFFFF">Field Ops Sync · cross-squad (G&amp;E ↔ GIS)</text>
      <text x="14" y="68" font-size="11" fill="#C2E5C2">G&amp;E + GIS leads · outage data flow alignment</text>
      <text x="14" y="84" font-size="11" fill="#C2E5C2">Bridge to Squad M2C-SL (Smart Metering data)</text>
    </g>

    <g transform="translate(20,416)">
      <rect width="1100" height="100" rx="6" fill="#0E2240" stroke="#F08A3E" stroke-width="2"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#F08A3E" letter-spacing="1">QUARTERLY</text>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#FFFFFF">Big Room Planning (BRP) · cross-VS · 2 days</text>
      <text x="14" y="68" font-size="11" fill="#9FB3D1">Aligned with P&amp;S Networks BRP cadence (most mature playbook)</text>
      <text x="14" y="84" font-size="11" fill="#9FB3D1">VS-2 ↔ P&amp;S Networks dependency mapping (field operations are connected to grid plans)</text>
    </g>

    <g transform="translate(20,532)">
      <rect width="1100" height="80" rx="6" fill="#1F2A33" stroke="#9FB3D1"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#9FB3D1" letter-spacing="1">ANNUAL</text>
      <text x="14" y="48" font-size="14" font-weight="700" fill="#FFFFFF">PDD Governance · large projects only</text>
      <text x="14" y="68" font-size="11" fill="#9FB3D1">Travis (PMO Lead) · GIS PDD demand process drives medium/large project approval</text>
    </g>

    <g transform="translate(20,632)">
      <text x="0" y="14" font-size="11" font-weight="800" fill="#9FB3D1" letter-spacing="2">DUTY ROTATION</text>
      <text x="0" y="36" font-size="11" fill="#FFFFFF">1 person on duty per squad per week · handles Expedite + Standard small items + production errors</text>
      <text x="0" y="52" font-size="11" fill="#FFFFFF">Rest of squad protected for Build/Project (Standard medium/large items + Fixed-Date)</text>
    </g>
  </g>

  <!-- PM & Planning -->
  <g transform="translate(1220,590)" filter="url(#cardShadow)">
    <rect width="1120" height="700" rx="10" fill="#15304F" stroke="#5DA460" stroke-width="2"/>
    <rect width="1120" height="46" rx="10" fill="#5DA460"/>
    <text x="20" y="30" font-size="18" font-weight="800" fill="#FFFFFF">PRODUCT MANAGEMENT &amp; PLANNING</text>

    <g transform="translate(20,68)">
      <rect width="1080" height="160" rx="6" fill="#3A2D52"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#D4C4E8" letter-spacing="1">PM STEWARD POOL</text>
      <text x="14" y="50" font-size="16" font-weight="700" fill="#FFFFFF">P&amp;T pool (existing intermediary)</text>
      <line x1="14" y1="62" x2="1066" y2="62" stroke="#8B6FB8" stroke-dasharray="3 3"/>
      <text x="14" y="84" font-size="12" fill="#FFFFFF">• P&amp;T already serves as intermediary between business and ITBA — formalized in TOM</text>
      <text x="14" y="102" font-size="12" fill="#FFFFFF">• "P&amp;T is the face — helping prioritize the work" — George Porto interview</text>
      <text x="14" y="120" font-size="12" fill="#FFFFFF">• Same P&amp;T pool serves VS-3 (Corporate &amp; Global SAP)</text>
      <text x="14" y="142" font-size="11" font-style="italic" fill="#D4C4E8">Source: AS-IS interviews · Slide 30 KEY PATTERN</text>
    </g>

    <g transform="translate(20,244)">
      <rect width="1080" height="200" rx="6" fill="#1F4E79"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#C2E5C2" letter-spacing="1">PLANNING APPROACH (mixed: continuous + PDD-driven)</text>
      <text x="14" y="50" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Continuous prioritization</tspan> for break-fix and small demand (Standard CoS · FIFO)</text>
      <text x="14" y="72" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Annual PDD process</tspan> for medium/large projects — already established in GIS &amp; G&amp;E</text>
      <text x="14" y="94" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Pain Score</tspan> ranks backlog (utility-calibrated):</text>
      <text x="14" y="116" font-size="13" fill="#C2E5C2" font-weight="700">  H(x) = (BV·w₁ + UX·w₂ + Safety·w₃) / Effort</text>
      <text x="14" y="138" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Class of Service mix</tspan> target: 60% Standard · 20% Fixed-Date (regulatory) · 5% Expedite · 15% Intangible</text>
      <text x="14" y="160" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Run/Grow/Transform</tspan> tagged at intake; field ops typically ~70 Run · 25 Grow · 5 Transform</text>
      <text x="14" y="184" font-size="11" font-style="italic" fill="#9FB3D1">Reference: P&amp;S nWOW v1.2 BRP (most mature playbook in the org)</text>
    </g>

    <g transform="translate(20,460)">
      <rect width="1080" height="220" rx="6" fill="#0E2240" stroke="#F08A3E"/>
      <text x="14" y="24" font-size="13" font-weight="800" fill="#F08A3E" letter-spacing="1">FORUMS REQUIRED (cross-VS · governance)</text>

      <text x="14" y="50" font-size="13" font-weight="700" fill="#FFFFFF">Critical Integrations <tspan fill="#9FB3D1" font-weight="400">— weekly</tspan></text>
      <text x="14" y="68" font-size="11" fill="#9FB3D1">Tech Leads cross-VS · esp. VS-2 ↔ M2C-SL (outage data) and VS-2 ↔ Global SAP (asset data)</text>

      <text x="14" y="98" font-size="13" font-weight="700" fill="#FFFFFF">Field Ops Sync <tspan fill="#9FB3D1" font-weight="400">— monthly · NEW</tspan></text>
      <text x="14" y="116" font-size="11" fill="#9FB3D1">G&amp;E + GIS leads + Smart Metering bridge · field flow alignment</text>

      <text x="14" y="146" font-size="13" font-weight="700" fill="#FFFFFF">Portfolio Committee (Gate 2) <tspan fill="#9FB3D1" font-weight="400">— monthly</tspan></text>
      <text x="14" y="164" font-size="11" fill="#9FB3D1">Vitor + Carlos + PM stewards · capacity slotting</text>

      <text x="14" y="194" font-size="13" font-weight="700" fill="#FFFFFF">Big Room Planning + PDD Governance <tspan fill="#9FB3D1" font-weight="400">— quarterly + annual</tspan></text>
      <text x="14" y="212" font-size="11" font-style="italic" fill="#F08A3E">Aligned with P&amp;S Networks BRP and Travis-led PDD cycle</text>
    </g>
  </g>

  <text x="60" y="1320" font-size="11" fill="#6F87A8">Source: AS-IS Slides 21–22, 26 · Champion interviews (George Porto, Andrew McGibbon) · Avangrid_Hierarchy_Overview.md</text>
