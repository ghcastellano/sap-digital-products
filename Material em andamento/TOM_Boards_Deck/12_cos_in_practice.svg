<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1F3458"/>
    </pattern>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="#0E2240"/>
  <rect width="2400" height="1350" fill="url(#dotgrid)" opacity="0.5"/>

  <text x="60" y="68" font-size="14" font-weight="700" fill="#F08A3E" letter-spacing="3">12  ·  CLASS OF SERVICE IN PRACTICE</text>
  <text x="60" y="118" font-size="40" font-weight="800" fill="#FFFFFF">Four Service Classes · Five Paths · One Backlog</text>
  <text x="60" y="148" font-size="16" fill="#9FB3D1">How Standard · Fixed-Date · Expedite · Intangible flow through the same boards with different policies and capacity reserves</text>

  <!-- Four CoS columns -->
  <g transform="translate(60,200)">

    <!-- STANDARD -->
    <g filter="url(#cardShadow)">
      <rect width="560" height="1080" rx="12" fill="#15304F" stroke="#0F4A6B" stroke-width="2"/>
      <rect width="560" height="80" rx="12" fill="#0F4A6B"/>
      <text x="20" y="34" font-size="22" font-weight="800" fill="#FFFFFF">STANDARD</text>
      <text x="20" y="62" font-size="14" font-weight="600" fill="#B7DDEF">Default flow · FIFO · Pain Score ranked</text>

      <text x="20" y="120" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">WHEN TO USE</text>
      <text x="20" y="146" font-size="13" fill="#FFFFFF">The bulk of demand · normal scheduling</text>
      <text x="20" y="166" font-size="13" fill="#FFFFFF">No external deadline · no customer-facing severity</text>

      <text x="20" y="208" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">CAPACITY ALLOCATION</text>
      <text x="20" y="234" font-size="13" fill="#FFFFFF">~60–70% of squad capacity</text>
      <text x="20" y="254" font-size="11" fill="#9FB3D1" font-style="italic">VS-1: 70% · VS-2: 60% · VS-3: 50%</text>

      <text x="20" y="296" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">PATH</text>
      <text x="20" y="322" font-size="13" fill="#FFFFFF">Full intake (1→2→3→4) → Gate 2 → 7 → 8</text>
      <text x="20" y="342" font-size="11" fill="#9FB3D1">Skip Gate 1 if Size = Small or BAU</text>
      <text x="20" y="358" font-size="11" fill="#9FB3D1">Skip Gate 2 if Size = Small + effort &lt; 2 days</text>

      <text x="20" y="400" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">WIP LIMIT (per squad)</text>
      <text x="20" y="426" font-size="22" font-weight="800" fill="#B7DDEF">3–4</text>

      <text x="20" y="468" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">AGING ALERT</text>
      <text x="20" y="494" font-size="13" fill="#FFFFFF">14 days in a column triggers Slack alert</text>

      <text x="20" y="536" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">EXAMPLES</text>
      <text x="20" y="562" font-size="12" fill="#FFFFFF">• Disconnect-flow rebuild (M2C-SL)</text>
      <text x="20" y="582" font-size="12" fill="#FFFFFF">• CRM data deduplication (CCC)</text>
      <text x="20" y="602" font-size="12" fill="#FFFFFF">• ARCFM enhancement (GIS)</text>
      <text x="20" y="622" font-size="12" fill="#FFFFFF">• HR module configuration (Corporate)</text>

      <rect x="20" y="660" width="520" height="380" rx="6" fill="#0E2240"/>
      <text x="34" y="686" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">DAILY BEHAVIOR</text>
      <text x="34" y="710" font-size="12" fill="#FFFFFF">• Pulled into squad TODO during weekly Replenishment</text>
      <text x="34" y="730" font-size="12" fill="#FFFFFF">• Worked by Build/Project sub-team (not duty engineer)</text>
      <text x="34" y="750" font-size="12" fill="#FFFFFF">• Aging tracked at Daily Flow Review</text>
      <text x="34" y="770" font-size="12" fill="#FFFFFF">• Re-ranked monthly at Portfolio Committee</text>

      <text x="34" y="810" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">FORUMS</text>
      <text x="34" y="834" font-size="12" fill="#FFFFFF">• Replenishment (weekly)</text>
      <text x="34" y="854" font-size="12" fill="#FFFFFF">• Service Delivery Review (bi-weekly)</text>
      <text x="34" y="874" font-size="12" fill="#FFFFFF">• Portfolio Committee (monthly)</text>

      <text x="34" y="914" font-size="12" font-weight="800" fill="#9FB3D1" letter-spacing="2">METRICS</text>
      <text x="34" y="938" font-size="12" fill="#FFFFFF">• Lead Time · Cycle Time · Throughput</text>
      <text x="34" y="958" font-size="12" fill="#FFFFFF">• WIP Aging distribution</text>
      <text x="34" y="978" font-size="12" fill="#FFFFFF">• Re-rank stability (% of items moved monthly)</text>

      <text x="34" y="1018" font-size="11" font-style="italic" fill="#9FB3D1">Source: Renewables DTO Slide 28 (End-to-End Kanban)</text>
    </g>

    <!-- FIXED-DATE -->
    <g transform="translate(580,0)" filter="url(#cardShadow)">
      <rect width="560" height="1080" rx="12" fill="#15304F" stroke="#FFAB00" stroke-width="2"/>
      <rect width="560" height="80" rx="12" fill="#FFAB00"/>
      <text x="20" y="34" font-size="22" font-weight="800" fill="#172B4D">FIXED-DATE</text>
      <text x="20" y="62" font-size="14" font-weight="600" fill="#172B4D">Deadline-locked · scheduled backwards</text>

      <text x="20" y="120" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">WHEN TO USE</text>
      <text x="20" y="146" font-size="13" fill="#FFFFFF">External deadline (regulator, contract, vendor lock)</text>
      <text x="20" y="166" font-size="13" fill="#FFFFFF">Late delivery has compliance or financial penalty</text>

      <text x="20" y="208" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">CAPACITY ALLOCATION</text>
      <text x="20" y="234" font-size="13" fill="#FFFFFF">~15–25% of squad capacity</text>
      <text x="20" y="254" font-size="11" fill="#FFE5A8" font-style="italic">Highest in VS-3 Corporate (regulatory-heavy 25%)</text>

      <text x="20" y="296" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">PATH</text>
      <text x="20" y="322" font-size="13" fill="#FFFFFF">1→2→3→4 → Skip Gate 1 → Gate 2 → 7 → 8</text>
      <text x="20" y="342" font-size="11" fill="#FFE5A8">Auto-Fixed-Date if Regulatory flag = TRUE</text>
      <text x="20" y="358" font-size="11" fill="#FFE5A8">Sponsor must be from Compliance/Legal</text>

      <text x="20" y="400" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">WIP LIMIT (per squad)</text>
      <text x="20" y="426" font-size="22" font-weight="800" fill="#FFD166">2</text>

      <text x="20" y="468" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">AGING ALERT</text>
      <text x="20" y="494" font-size="13" fill="#FFFFFF">50% of remaining timeline · auto-escalation</text>

      <text x="20" y="536" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">EXAMPLES</text>
      <text x="20" y="562" font-size="12" fill="#FFFFFF">• PUC tariff banner update (M2C-RO)</text>
      <text x="20" y="582" font-size="12" fill="#FFFFFF">• SOX audit log (Corporate Apps)</text>
      <text x="20" y="602" font-size="12" fill="#FFFFFF">• Iberdrola Q-close calendar (Global SAP)</text>
      <text x="20" y="622" font-size="12" fill="#FFFFFF">• CT/ME/NY Smart Metering rollout milestones</text>

      <rect x="20" y="660" width="520" height="380" rx="6" fill="#0E2240"/>
      <text x="34" y="686" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">DAILY BEHAVIOR</text>
      <text x="34" y="710" font-size="12" fill="#FFFFFF">• Scheduled <tspan font-weight="700">backwards</tspan> from deadline</text>
      <text x="34" y="730" font-size="12" fill="#FFFFFF">• Locked into squad capacity reserve at Gate 2</text>
      <text x="34" y="750" font-size="12" fill="#FFFFFF">• Daily review checks runway vs. days-to-deadline</text>
      <text x="34" y="770" font-size="12" fill="#FFFFFF">• Auto-Expedite escalation if &lt; 30 days remaining</text>

      <text x="34" y="810" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">FORUMS</text>
      <text x="34" y="834" font-size="12" fill="#FFFFFF">• Daily Flow Review (escalation if at risk)</text>
      <text x="34" y="854" font-size="12" fill="#FFFFFF">• Customer Journey Forum (CS · CX-related)</text>
      <text x="34" y="874" font-size="12" fill="#FFFFFF">• Iberdrola Sync (Global SAP regulatory)</text>

      <text x="34" y="914" font-size="12" font-weight="800" fill="#FFD166" letter-spacing="2">METRICS</text>
      <text x="34" y="938" font-size="12" fill="#FFFFFF">• % delivered on or before due date</text>
      <text x="34" y="958" font-size="12" fill="#FFFFFF">• Schedule Performance Index</text>
      <text x="34" y="978" font-size="12" fill="#FFFFFF">• Compliance breach incidents (target: 0)</text>

      <text x="34" y="1018" font-size="11" font-style="italic" fill="#FFE5A8">Source: AS-IS Slide 26 — Regulatory always wins</text>
    </g>

    <!-- EXPEDITE -->
    <g transform="translate(1160,0)" filter="url(#cardShadow)">
      <rect width="560" height="1080" rx="12" fill="#15304F" stroke="#B83567" stroke-width="2"/>
      <rect width="560" height="80" rx="12" fill="#B83567"/>
      <text x="20" y="34" font-size="22" font-weight="800" fill="#FFFFFF">EXPEDITE</text>
      <text x="20" y="62" font-size="14" font-weight="600" fill="#FCD2DD">Jump-the-queue · 1 in flight · capacity reserved</text>

      <text x="20" y="120" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">WHEN TO USE</text>
      <text x="20" y="146" font-size="13" fill="#FFFFFF">P1/P2 customer impact · production outage</text>
      <text x="20" y="166" font-size="13" fill="#FFFFFF">Regulatory deadline imminent (&lt; 30 days remaining)</text>

      <text x="20" y="208" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">CAPACITY ALLOCATION</text>
      <text x="20" y="234" font-size="13" fill="#FFFFFF">~5–10% capacity reserve · blocked-out per quarter</text>
      <text x="20" y="254" font-size="11" fill="#FCD2DD" font-style="italic">If empty: capacity flows to Standard</text>

      <text x="20" y="296" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">PATH</text>
      <text x="20" y="322" font-size="13" fill="#FFFFFF">1→2→3 → Skip Gates → 7 → 8</text>
      <text x="20" y="342" font-size="11" fill="#FCD2DD">Auto-trigger from Customer Impact Tier P1/P2</text>
      <text x="20" y="358" font-size="11" fill="#FCD2DD">DoR relaxed (best-guess fields acceptable)</text>

      <text x="20" y="400" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">WIP LIMIT (per squad)</text>
      <text x="20" y="426" font-size="22" font-weight="800" fill="#FCD2DD">1</text>

      <text x="20" y="468" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">AGING ALERT</text>
      <text x="20" y="494" font-size="13" fill="#FFFFFF">4 hours · auto-escalation to Squad Lead + PM</text>

      <text x="20" y="536" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">EXAMPLES</text>
      <text x="20" y="562" font-size="12" fill="#FFFFFF">• Billing engine down (P1)</text>
      <text x="20" y="582" font-size="12" fill="#FFFFFF">• IVR returning 503 (P1)</text>
      <text x="20" y="602" font-size="12" fill="#FFFFFF">• Iberdrola month-close blocker (P2)</text>
      <text x="20" y="622" font-size="12" fill="#FFFFFF">• Outage of customer self-service portal</text>

      <rect x="20" y="660" width="520" height="380" rx="6" fill="#0E2240"/>
      <text x="34" y="686" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">DAILY BEHAVIOR</text>
      <text x="34" y="710" font-size="12" fill="#FFFFFF">• Picked up by <tspan font-weight="700">duty engineer</tspan> (rotation)</text>
      <text x="34" y="730" font-size="12" fill="#FFFFFF">• Interrupts Standard work (only 1 in flight)</text>
      <text x="34" y="750" font-size="12" fill="#FFFFFF">• Vendor first-response if applicable (Accenture for Global SAP)</text>
      <text x="34" y="770" font-size="12" fill="#FFFFFF">• Post-incident: root-cause Story added to Backlog</text>

      <text x="34" y="810" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">FORUMS</text>
      <text x="34" y="834" font-size="12" fill="#FFFFFF">• Daily Flow Review (escalates within 4h)</text>
      <text x="34" y="854" font-size="12" fill="#FFFFFF">• Critical Integrations (cross-VS impact)</text>
      <text x="34" y="874" font-size="12" fill="#FFFFFF">• Thursday Accenture Review (Iberdrola)</text>

      <text x="34" y="914" font-size="12" font-weight="800" fill="#FCD2DD" letter-spacing="2">METRICS</text>
      <text x="34" y="938" font-size="12" fill="#FFFFFF">• Mean Time to Resolution (target: &lt; 4h)</text>
      <text x="34" y="958" font-size="12" fill="#FFFFFF">• Expedite frequency (target: declining trend)</text>
      <text x="34" y="978" font-size="12" fill="#FFFFFF">• Capacity-reserve utilization</text>

      <text x="34" y="1018" font-size="11" font-style="italic" fill="#FCD2DD">"If everything is urgent, nothing is urgent" — Digital CoE Slide 105</text>
    </g>

    <!-- INTANGIBLE -->
    <g transform="translate(1740,0)" filter="url(#cardShadow)">
      <rect width="540" height="1080" rx="12" fill="#15304F" stroke="#A0CAA0" stroke-width="2"/>
      <rect width="540" height="80" rx="12" fill="#A0CAA0"/>
      <text x="20" y="34" font-size="22" font-weight="800" fill="#172B4D">INTANGIBLE</text>
      <text x="20" y="62" font-size="14" font-weight="600" fill="#172B4D">Tech debt · refactor · enablers</text>

      <text x="20" y="120" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">WHEN TO USE</text>
      <text x="20" y="146" font-size="13" fill="#FFFFFF">No direct user-visible value · long-term health</text>
      <text x="20" y="166" font-size="13" fill="#FFFFFF">Refactor · platform enablers · documentation</text>

      <text x="20" y="208" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">CAPACITY ALLOCATION</text>
      <text x="20" y="234" font-size="13" fill="#FFFFFF">~10–15% capacity reserved per quarter</text>
      <text x="20" y="254" font-size="11" fill="#A0CAA0" font-style="italic">Verbatim from CS Slide 3 (Apr 2026)</text>

      <text x="20" y="296" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">PATH</text>
      <text x="20" y="322" font-size="13" fill="#FFFFFF">1→2→3→4 → Skip Gate 1 → Gate 2 → 7 → 8</text>
      <text x="20" y="342" font-size="11" fill="#A0CAA0">Same as Standard for gates (no Shark Tank for tech debt)</text>

      <text x="20" y="400" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">WIP LIMIT (per squad)</text>
      <text x="20" y="426" font-size="22" font-weight="800" fill="#A0CAA0">1</text>

      <text x="20" y="468" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">AGING ALERT</text>
      <text x="20" y="494" font-size="13" fill="#FFFFFF">90 days · low-priority alert (not escalated)</text>

      <text x="20" y="536" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">EXAMPLES</text>
      <text x="20" y="562" font-size="12" fill="#FFFFFF">• CRM tech debt cleanup</text>
      <text x="20" y="582" font-size="12" fill="#FFFFFF">• Kernel patch upgrades (SAP Basis)</text>
      <text x="20" y="602" font-size="12" fill="#FFFFFF">• Pipeline modernization (DevOps)</text>
      <text x="20" y="622" font-size="12" fill="#FFFFFF">• Documentation refresh</text>

      <rect x="20" y="660" width="500" height="380" rx="6" fill="#0E2240"/>
      <text x="34" y="686" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">DAILY BEHAVIOR</text>
      <text x="34" y="710" font-size="12" fill="#FFFFFF">• Picked up when Standard slack opens</text>
      <text x="34" y="730" font-size="12" fill="#FFFFFF">• Capacity protected: cannot be cancelled to feed Build</text>
      <text x="34" y="750" font-size="12" fill="#FFFFFF">• Often coordinated with Platform teams</text>
      <text x="34" y="770" font-size="12" fill="#FFFFFF">• Output may release Standard items downstream</text>

      <text x="34" y="810" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">FORUMS</text>
      <text x="34" y="834" font-size="12" fill="#FFFFFF">• Retro / Kaizen (where Intangible is added)</text>
      <text x="34" y="854" font-size="12" fill="#FFFFFF">• Cross-squad platform sync</text>

      <text x="34" y="914" font-size="12" font-weight="800" fill="#A0CAA0" letter-spacing="2">METRICS</text>
      <text x="34" y="938" font-size="12" fill="#FFFFFF">• Capacity-reserve utilization (≥ 10%)</text>
      <text x="34" y="958" font-size="12" fill="#FFFFFF">• Tech debt aging trend</text>
      <text x="34" y="978" font-size="12" fill="#FFFFFF">• Lead time impact (downstream Standard items)</text>

      <text x="34" y="1018" font-size="11" font-style="italic" fill="#A0CAA0">Source: CS Slide 3 — "Capacity reserved 10–15%/quarter"</text>
    </g>
  </g>

  <text x="60" y="1320" font-size="11" fill="#6F87A8">Source: Class of Service framework from Renewables DTO + CS Proposed Value Streams Slide 3 + Pain Point Evidence Matrix · "If everything is urgent, nothing is urgent" — Digital CoE Slide 105</text>
  <text x="2340" y="1320" text-anchor="end" font-size="11" fill="#6F87A8">12 / 12</text>
</svg>
