      <text x="14" y="24" font-size="13" font-weight="800" fill="#B7DDEF" letter-spacing="1">PLANNING APPROACH (regulatory + project mix)</text>
      <text x="14" y="50" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Regulatory items</tspan> always Class of Service Fixed-Date (deadline-locked)</text>
      <text x="14" y="72" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">PDD-driven planning</tspan> for medium/large Corporate projects (annual cycle)</text>
      <text x="14" y="94" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Pain Score</tspan> ranks backlog (utility-calibrated):</text>
      <text x="14" y="116" font-size="13" fill="#B7DDEF" font-weight="700">  H(x) = (BV·w₁ + UX·w₂ + Safety·w₃) / Effort</text>
      <text x="14" y="138" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Class of Service mix</tspan> target: 50% Standard · 25% Fixed-Date (regulatory-heavy) · 10% Expedite · 15% Intangible</text>
      <text x="14" y="160" font-size="13" fill="#FFFFFF">• <tspan font-weight="700">Run/Grow/Transform</tspan> Global SAP: ~80 Run · 15 Grow · 5 Transform (incident-dominated)</text>
      <text x="14" y="184" font-size="11" font-style="italic" fill="#9FB3D1">Goal: shift mix toward Grow/Transform via Expedite policy + Intangible reserve</text>
    </g>

    <g transform="translate(20,460)">
